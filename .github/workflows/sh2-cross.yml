# SH-2 cross build of sh2o in the pinned Yaul image (the digest that SH2ZAM's
# CI also uses). Native and portable builds; both must be big-endian SH-2
# objects that need no C library function, and the sha256 of every object,
# library and model ELF must equal tests/sh2/objects.sha256. Job sh2-model runs the oracle
# vectors on the SH-2 instruction model (MODELLED cycles; it fetches Yabause).
# Job sh2-model-zam runs every family with the experimental SH2ZAM delegate.
name: sh2o SH-2 cross build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SH2_IMAGE: ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6
jobs:
  sh2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Pull the pinned Yaul image
        run: docker pull "$SH2_IMAGE"
      - name: make cross
        run: make cross SH2_IMAGE="$SH2_IMAGE"
      - name: Keep the object reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sh2-objects
          path: |
            build/sh2-native/
            build/sh2-portable/
            build/sh2-static/
          if-no-files-found: ignore
  sh2-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Pull the pinned Yaul image
        run: docker pull "$SH2_IMAGE"
      - name: make sh2-model
        shell: bash
        run: make sh2-model SH2_IMAGE="$SH2_IMAGE" | tee sh2-model-results.txt
      - name: Keep the model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sh2-model-results
          path: |
            sh2-model-results.txt
            build/sh2-model/native/
            build/sh2-model/portable/
            build/sh2-model/plant.out
            build/sh2-model/plant.err
          if-no-files-found: ignore
  sh2-model-zam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Pull the pinned Yaul image
        run: docker pull "$SH2_IMAGE"
      - name: make sh2-model SH2O_ZAM=ON
        shell: bash
        run: make sh2-model SH2O_ZAM=ON SH2_IMAGE="$SH2_IMAGE" | tee sh2-model-zam-results.txt
      - name: Keep the model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sh2-model-zam-results
          path: |
            sh2-model-zam-results.txt
            build/sh2-model-zam/native/
            build/sh2-model-zam/portable/
            build/sh2-model-zam/zam-plant-known.out
            build/sh2-model-zam/zam-plant-known.err
            build/sh2-model-zam/zam-plant-digest.out
            build/sh2-model-zam/zam-plant-digest.err
          if-no-files-found: ignore
