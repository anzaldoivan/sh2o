# The job rules are in CONTRIBUTING.md, section "CI jobs"; scripts/check_ci.py checks them.
# SH-2 cross build of sh2o in the pinned Yaul image (the digest that SH2ZAM's
# CI also uses; the Makefile holds it, and docker run pulls it by digest).
# Native and portable builds; both must be big-endian SH-2
# objects that need no C library function, and the sha256 of every object,
# library and model ELF must equal tests/sh2/objects.sha256. Job sh2-model runs the oracle
# vectors on the SH-2 instruction model (MODELLED cycles; it fetches Yabause
# once into a cache keyed by the pinned commit). Its row sh2-model-zam runs
# every family with the experimental SH2ZAM delegate.
name: sh2o SH-2 cross build
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sh2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: make cross
        run: make cross
      - name: Keep the object reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sh2-objects
          path: |
            build/sh2-native/
            build/sh2-portable/
            build/sh2-static/
          if-no-files-found: ignore
  sh2-model:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sh2-model
            zam: OFF
          - name: sh2-model-zam
            zam: ON
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Keep the pinned Yabause source
        uses: actions/cache@v4
        with:
          path: .cache/yabause
          key: yabause-7e38821dbac265490f115e163c523a939acda759
      - name: make sh2-model SH2O_ZAM=${{ matrix.zam }}
        shell: bash
        run: make sh2-model SH2O_ZAM=${{ matrix.zam }} | tee ${{ matrix.name }}-results.txt
      - name: Keep the model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-results
          path: |
            ${{ matrix.name }}-results.txt
            build/${{ matrix.name }}/native/
            build/${{ matrix.name }}/portable/
            build/${{ matrix.name }}/*.out
            build/${{ matrix.name }}/*.err
          if-no-files-found: ignore
