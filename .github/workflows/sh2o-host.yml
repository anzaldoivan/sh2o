# Host build and tests of sh2o: GCC and Clang, strict warnings, sanitizers,
# the portable path and the installed package. Each step is a make target, so
# the same job runs on a local machine.
name: sh2o host
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    name: ${{ matrix.target }} (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        target: [test, strict, sanitize, portable, install-check]
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1
      SH2O_REQUIRE_PSYZ: 1
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the psyz pin (test-only, no nested submodules)
        run: git submodule update --init --checkout --depth 1 external/psyz
      - name: make ${{ matrix.target }} CC=${{ matrix.cc }}
        run: make ${{ matrix.target }} CC=${{ matrix.cc }}
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}-${{ matrix.cc }}
          path: build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
  host-zam:
    name: test SH2O_ZAM=ON (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      SH2O_REQUIRE_PSYZ: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch the psyz pin (test-only, no nested submodules)
        run: git submodule update --init --checkout --depth 1 external/psyz
      - name: make test SH2O_ZAM=ON CC=${{ matrix.cc }}
        run: make test SH2O_ZAM=ON CC=${{ matrix.cc }}
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-zam-${{ matrix.cc }}
          path: build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
